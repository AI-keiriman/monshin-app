{% extends "base.html" %}
{% from "_form_errors.html" import field %}
{% block content %}
<h1>ログイン</h1>
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.email) }}
  {{ field(form.password) }}
  <button type="submit">ログイン</button>
</form>
<p>はじめての方は、<a href="{{ url_for('auth.register') }}">会員登録</a>をしてください。</p>
{% endblock %}
