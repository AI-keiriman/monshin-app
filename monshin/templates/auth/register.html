{% extends "base.html" %}
{% from "_form_errors.html" import field %}
{% block body_class %}body--photo{% endblock %}
{% block content %}
<div class="auth-panel">
<h1>会員登録</h1>
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.name) }}
  {{ field(form.email) }}
  {{ field(form.password) }}
  <button type="submit">登録する</button>
</form>
<p>登録済みの方は、<a href="{{ url_for('auth.login') }}">ログイン</a>してください。</p>
</div>
{% endblock %}
