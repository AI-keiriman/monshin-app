{% extends "base.html" %}
{% from "_form_errors.html" import field %}
{% block content %}
<div class="split">
  <img src="{{ url_for('static', filename='img/workshop-body.jpg') }}" alt="塗装の前のギターのボディ" width="900" height="1200">
  <div>
<h1>会員登録</h1>
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.email) }}
  {{ field(form.password) }}
  <button type="submit">登録する</button>
</form>
<p>登録済みの方は、<a href="{{ url_for('auth.login') }}">ログイン</a>してください。</p>
  </div>
</div>
{% endblock %}
