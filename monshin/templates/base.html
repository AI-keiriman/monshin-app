<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ギター修理の AI 見積{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="{{ url_for('main.index') }}"><strong>ギター修理の AI 見積</strong></a></li></ul>
      <ul>
        {% if current_user.is_authenticated %}
          <li><a href="{{ url_for('consultations.index') }}">問診の一覧</a></li>
          <li>{{ current_user.email }}</li>
          <li>
            <form method="post" action="{{ url_for('auth.logout') }}" style="margin:0">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="secondary outline">ログアウト</button>
            </form>
          </li>
        {% else %}
          <li><a href="{{ url_for('auth.login') }}">ログイン</a></li>
          <li><a href="{{ url_for('auth.register') }}">会員登録</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% for message in get_flashed_messages() %}
      <article>{{ message }}</article>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // AI を呼ぶフォームの送信のボタン（data-once）を、2回押せないようにする
    document.addEventListener("submit", (event) => {
      const button = event.target.querySelector("button[data-once]");
      if (button) {
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
      }
    });
    // ブラウザーの「戻る」で戻ったときは、もう一度押せるようにする
    window.addEventListener("pageshow", () => {
      document.querySelectorAll("button[data-once]").forEach((button) => {
        button.disabled = false;
        button.removeAttribute("aria-busy");
      });
    });
  </script>
</body>
</html>
